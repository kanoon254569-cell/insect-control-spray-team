<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Sequence Diagram การเข้าสู่ระบบ</title><desc id="desc">ลำดับการเข้าสู่ระบบผ่านรหัสผ่านหรือ LINE และสร้าง session</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3Z" fill="#526273"/></marker><style>text{font-family:Arial,'Noto Sans Thai',sans-serif;fill:#172b3a}.title{font-size:26px;font-weight:700}.head{font-size:15px;font-weight:700}.msg{font-size:12px}.life{stroke:#94a3b2;stroke-width:1.5;stroke-dasharray:6 5}.call{stroke:#526273;stroke-width:2;marker-end:url(#arrow)}.return{stroke:#6c8b7e;stroke-width:1.8;stroke-dasharray:6 4;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="700" fill="#f5f8fa"/><text x="35" y="42" class="title">Sequence Diagram: เข้าสู่ระบบ</text>
  <g><rect x="40" y="75" width="160" height="52" rx="8" fill="#e8f4f1" stroke="#5a9e8b"/><rect x="270" y="75" width="160" height="52" rx="8" fill="#e8f2f8" stroke="#5687a7"/><rect x="500" y="75" width="160" height="52" rx="8" fill="#e8f2f8" stroke="#5687a7"/><rect x="730" y="75" width="160" height="52" rx="8" fill="#fff3dc" stroke="#d59d3f"/><rect x="960" y="75" width="190" height="52" rx="8" fill="#edf1f8" stroke="#788db0"/></g>
  <g text-anchor="middle" class="head"><text x="120" y="107">ผู้ใช้</text><text x="350" y="107">Login Page</text><text x="580" y="107">Express API</text><text x="810" y="107">PostgreSQL</text><text x="1055" y="107">LINE Login</text></g>
  <g class="life"><path d="M120 127 V660 M350 127 V660 M580 127 V660 M810 127 V660 M1055 127 V660"/></g>
  <rect x="35" y="150" width="1125" height="230" rx="8" fill="#fff" fill-opacity=".7" stroke="#cbd5df"/><text x="50" y="174" class="head">ทางเลือก A: username / password</text>
  <path class="call" d="M120 205 H350"/><text x="230" y="198" text-anchor="middle" class="msg">กรอกข้อมูลเข้าสู่ระบบ</text>
  <path class="call" d="M350 240 H580"/><text x="465" y="233" text-anchor="middle" class="msg">POST /api/login</text>
  <path class="call" d="M580 275 H810"/><text x="695" y="268" text-anchor="middle" class="msg">ค้นหาผู้ใช้ / สมาชิกทีม</text>
  <path class="return" d="M810 310 H580"/><text x="695" y="303" text-anchor="middle" class="msg">ข้อมูลบัญชีและ password hash</text>
  <path class="call" d="M580 345 H810"/><text x="695" y="338" text-anchor="middle" class="msg">บันทึก Session (อายุ 8 ชั่วโมง)</text>
  <path class="return" d="M580 365 H350"/><text x="465" y="359" text-anchor="middle" class="msg">ตั้ง HttpOnly cookie และส่ง role</text>
  <rect x="35" y="405" width="1125" height="225" rx="8" fill="#fff" fill-opacity=".7" stroke="#cbd5df"/><text x="50" y="429" class="head">ทางเลือก B: LINE Login</text>
  <path class="call" d="M120 460 H350"/><text x="230" y="453" text-anchor="middle" class="msg">เลือกเข้าสู่ระบบด้วย LINE</text>
  <path class="call" d="M350 495 H580"/><text x="465" y="488" text-anchor="middle" class="msg">เริ่ม OAuth และตรวจ state</text>
  <path class="call" d="M580 530 H1055"/><text x="817" y="523" text-anchor="middle" class="msg">แลก authorization code / ตรวจ ID token</text>
  <path class="return" d="M1055 565 H580"/><text x="817" y="558" text-anchor="middle" class="msg">ส่งข้อมูลโปรไฟล์ LINE</text>
  <path class="call" d="M580 595 H810"/><text x="695" y="588" text-anchor="middle" class="msg">สร้าง/ค้นหาบัญชีลูกค้าและ Session</text>
  <path class="return" d="M580 615 H350"/><text x="465" y="609" text-anchor="middle" class="msg">ตั้ง HttpOnly cookie</text>
</svg>
