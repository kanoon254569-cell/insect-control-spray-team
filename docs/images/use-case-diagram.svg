<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Use Case Diagram ระบบ NP Place Control</title>
  <desc id="desc">แผนภาพผู้ใช้งาน ลูกค้า ผู้ดูแล ช่าง และ LINE ที่เชื่อมกับกรณีใช้งานภายในระบบ</desc>
  <defs><style>text{font-family:Arial,'Noto Sans Thai',sans-serif;fill:#172b3a}.title{font-size:28px;font-weight:700}.actor{font-size:16px;font-weight:700}.uc{font-size:14px}.note{font-size:12px}.line{stroke:#65788a;stroke-width:1.8;fill:none}</style></defs>
  <rect width="1400" height="820" fill="#f5f8fa"/><text x="42" y="48" class="title">Use Case Diagram: NP Place Control</text>
  <rect x="300" y="92" width="835" height="675" rx="16" fill="#fff" stroke="#5687a7" stroke-width="3"/><text x="717" y="124" text-anchor="middle" class="actor">ระบบ NP Place Control</text>
  <g class="line">
    <path d="M155 205 L390 185 M155 205 L615 185 M155 205 L835 185 M155 205 L1050 185"/>
    <path d="M155 205 L390 295 M155 205 L615 295 M155 205 L835 295 M155 205 L1050 295"/>
    <path d="M1240 205 L390 405 M1240 205 L615 405 M1240 205 L835 405 M1240 205 L1050 405"/>
    <path d="M1240 205 L390 515 M1240 205 L615 515 M1240 205 L835 515 M1240 205 L1050 515"/>
    <path d="M690 700 L390 625 M690 700 L615 625 M690 700 L835 625"/>
    <path d="M1240 700 L1050 515 M1240 700 L1050 625"/>
  </g>
  <g fill="#f0f6fa" stroke="#5687a7" stroke-width="2">
    <ellipse cx="390" cy="185" rx="105" ry="34"/><ellipse cx="615" cy="185" rx="105" ry="34"/><ellipse cx="835" cy="185" rx="105" ry="34"/><ellipse cx="1050" cy="185" rx="105" ry="34"/>
    <ellipse cx="390" cy="295" rx="105" ry="34"/><ellipse cx="615" cy="295" rx="105" ry="34"/><ellipse cx="835" cy="295" rx="105" ry="34"/><ellipse cx="1050" cy="295" rx="105" ry="34"/>
    <ellipse cx="390" cy="405" rx="105" ry="34"/><ellipse cx="615" cy="405" rx="105" ry="34"/><ellipse cx="835" cy="405" rx="105" ry="34"/><ellipse cx="1050" cy="405" rx="105" ry="34"/>
    <ellipse cx="390" cy="515" rx="105" ry="34"/><ellipse cx="615" cy="515" rx="105" ry="34"/><ellipse cx="835" cy="515" rx="105" ry="34"/><ellipse cx="1050" cy="515" rx="105" ry="34"/>
    <ellipse cx="390" cy="625" rx="105" ry="34"/><ellipse cx="615" cy="625" rx="105" ry="34"/><ellipse cx="835" cy="625" rx="105" ry="34"/><ellipse cx="1050" cy="625" rx="105" ry="34"/>
  </g>
  <g class="uc" text-anchor="middle">
    <text x="390" y="190">เข้าสู่ระบบ / สมัครสมาชิก</text><text x="615" y="190">จัดการโปรไฟล์</text><text x="835" y="190">แจ้งปัญหา</text><text x="1050" y="190">ดูแพ็กเกจ / จองบริการ</text>
    <text x="390" y="300">ส่งหลักฐานชำระเงิน</text><text x="615" y="300">ติดตามงาน / สัญญา</text><text x="835" y="300">จัดการทีม / สมาชิก</text><text x="1050" y="300">จัดการใบแจ้งหนี้</text>
    <text x="390" y="410">มอบหมายทีม / วันนัด</text><text x="615" y="410">ตรวจรับงาน</text><text x="835" y="410">ดูงานของทีม</text><text x="1050" y="410">อัปเดตสถานะงาน</text>
    <text x="390" y="520">บันทึกผลการทำงาน</text><text x="615" y="520">แนบรูป / สารเคมี</text><text x="835" y="520">ตรวจสอบการชำระ</text><text x="1050" y="520">รับแจ้งเตือน LINE</text>
    <text x="390" y="630">จัดการสัญญา</text><text x="615" y="630">ดูรายการบริการ</text><text x="835" y="630">สร้างสัญญาหลังตรวจรับ</text><text x="1050" y="630">ยืนยันตัวตน LINE</text>
  </g>
