  <g class="actor" text-anchor="middle"><text x="155" y="300">ลูกค้า</text><text x="1240" y="300">ผู้ดูแลระบบ</text><text x="690" y="800">หัวหน้าทีม / ช่าง</text><text x="1240" y="800">LINE</text></g>
  <text x="320" y="790" class="note">เส้นแสดงการมีส่วนร่วมระหว่าง Actor และ Use Case ภายในขอบเขตระบบ</text>
</svg>
